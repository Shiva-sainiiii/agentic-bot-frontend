<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Agentic Bot — Project Pipeline</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
<style>
  :root {
    --bg: #0b0d12;
    --panel: #14171f;
    --border: #262a35;
    --text: #eceef2;
    --muted: #8b90a0;
    --accent: #7dd3c0;
    --accent-dim: #1a3a35;
    --danger: #ff8a8a;
    --danger-bg: #2a1515;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 16px;
    padding-bottom: 40px;
  }
  h1 { font-size: 1.25rem; margin: 4px 0 2px; }
  p.sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 20px; }
  textarea {
    width: 100%;
    min-height: 90px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 14px;
    font-size: 1rem;
    resize: vertical;
    font-family: inherit;
  }
  textarea:focus { outline: 1px solid var(--accent); }
  button.send {
    width: 100%;
    margin-top: 12px;
    background: var(--accent);
    color: #0b0d12;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
  }
  button.send:disabled { opacity: 0.5; }
  .status {
    margin-top: 14px;
    font-size: 0.82rem;
    color: var(--muted);
    display: none;
  }
  .status.show { display: block; }
  .error-box {
    color: var(--danger);
    background: var(--danger-bg);
    border: 1px solid #4a1f1f;
    border-radius: 10px;
    padding: 12px;
    margin-top: 16px;
    font-size: 0.85rem;
    white-space: pre-wrap;
    display: none;
  }
  .error-box.show { display: block; }
  .result { margin-top: 18px; display: none; }
  .result.show { display: block; }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .badge.success { background: var(--accent-dim); color: var(--accent); }
  .badge.fail { background: var(--danger-bg); color: var(--danger); }
  .report {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .file-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .file-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    cursor: pointer;
  }
  .file-name { font-family: monospace; font-size: 0.88rem; }
  .file-status { font-size: 0.75rem; font-weight: 700; }
  .file-status.ok { color: var(--accent); }
  .file-status.fail { color: var(--danger); }
  .file-code {
    display: none;
    padding: 0 14px 14px;
  }
  .file-code.open { display: block; }
  #fullLog {
    white-space: pre-wrap;
    word-break: break-word;
    background: #0b0d12;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 0.76rem;
    line-height: 1.5;
    margin: 0;
  }
  details.log-details { margin-top: 16px; }
  details.log-details summary { color: var(--muted); font-size: 0.82rem; cursor: pointer; }

  /* ---------- Progress tracker ---------- */
  .tracker {
    margin-top: 16px;
    display: none;
  }
  .tracker.show { display: block; }
  .tracker-overall {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .tracker-overall .elapsed { font-variant-numeric: tabular-nums; }
  .step-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .step {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    transition: background 0.2s, border-color 0.2s;
  }
  .step .icon {
    flex: 0 0 20px;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    margin-top: 1px;
  }
  .step .body { flex: 1; min-width: 0; }
  .step .label {
    font-size: 0.86rem;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .step .label .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .sub {
    font-size: 0.74rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .step .step-elapsed {
    font-size: 0.72rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* pending: dim/greyed */
  .step.pending { opacity: 0.45; }
  .step.pending .icon { color: var(--muted); }

  /* running: accent border + pulse dot */
  .step.running { border-color: var(--accent); background: var(--accent-dim); }
  .step.running .label { color: var(--accent); }
  .step.running .icon .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
  }

  /* stuck: running too long — turns amber + stronger pulse, explicit warning text */
  .step.stuck { border-color: #e0b34d; background: #2a2410; }
  .step.stuck .label { color: #e0b34d; }
  .step.stuck .icon .dot { background: #e0b34d; animation: pulse 0.6s ease-in-out infinite; }
  .step.stuck .sub { color: #e0b34d; }

  /* done */
  .step.done { border-color: var(--border); }
  .step.done .icon { color: var(--accent); }

  /* failed */
  .step.failed { border-color: #4a1f1f; background: var(--danger-bg); }
  .step.failed .label { color: var(--danger); }
  .step.failed .icon { color: var(--danger); }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.5; }
  }

  .file-step-group {
    margin-left: 22px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ---------- Upload area ---------- */
  .upload-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px dashed var(--border);
    color: var(--muted);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .upload-btn:active { border-color: var(--accent); color: var(--accent); }
  input[type="file"] { display: none; }
  .attached-files {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .attached-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: 999px;
    padding: 4px 10px 4px 12px;
    font-size: 0.74rem;
    font-family: monospace;
  }
  .attached-chip button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.9rem;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    opacity: 0.7;
  }
  .attached-chip button:active { opacity: 1; }

  /* ---------- Result header / actions ---------- */
  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 0.76rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .action-btn:active { border-color: var(--accent); color: var(--accent); }
  .action-btn.primary {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .action-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

  /* ---------- Markdown report ---------- */
  .report {
    font-size: 0.9rem;
    line-height: 1.6;
    white-space: normal;
  }
  .report h1, .report h2, .report h3 {
    color: var(--text);
    margin: 14px 0 6px;
    line-height: 1.3;
  }
  .report h1:first-child, .report h2:first-child, .report h3:first-child { margin-top: 0; }
  .report h1 { font-size: 1.1rem; }
  .report h2 { font-size: 1rem; }
  .report h3 { font-size: 0.92rem; color: var(--accent); }
  .report p { margin: 8px 0; }
  .report ul, .report ol { margin: 8px 0; padding-left: 20px; }
  .report li { margin: 3px 0; }
  .report strong { color: var(--accent); }
  .report code {
    background: #0b0d12;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.82em;
    font-family: 'SFMono-Regular', Consolas, monospace;
  }
  .report pre {
    margin: 10px 0;
  }
  .report pre code {
    border: none;
    padding: 0;
    background: none;
  }
  .report hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  /* ---------- Code blocks (Prism override) ---------- */
  pre[class*="language-"] {
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.76rem;
    line-height: 1.5;
    margin: 0;
    background: #0d1017 !important;
  }
  code[class*="language-"] { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }

  .file-toolbar {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    padding: 8px 14px 0;
  }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 0.7rem;
    cursor: pointer;
  }
  .icon-btn:active { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 11px; height: 11px; }
</style>
</head>
<body>
  <h1>🏗️ Project Pipeline</h1>
  <p class="sub">Planner → Coder → Test → Fixer → Reporter, multiple files, ek call mein.</p>

  <textarea id="task">Ek simple todo app banao HTML, CSS aur vanilla JavaScript mein. LocalStorage use karo data save karne ke liye.</textarea>

  <div class="upload-row">
    <label class="upload-btn" for="fileUpload">
      📎 File attach karo (reference ke liye)
    </label>
    <input type="file" id="fileUpload" multiple accept=".js,.ts,.py,.html,.css,.json,.txt,.md,.jsx,.tsx,.java,.go,.rb,.php,.sh" />
  </div>
  <div class="attached-files" id="attachedFiles"></div>

  <button class="send" id="sendBtn">Banao</button>

  <div class="status" id="statusMsg">⏳ Planner plan bana raha hai, phir har file ke liye code likha/test/fix ho raha hai... ye 1-3 minute le sakta hai, depend karta hai kitni files hain.</div>

  <div class="tracker" id="tracker">
    <div class="tracker-overall">
      <span id="trackerHeadline">Shuru ho raha hai…</span>
      <span class="elapsed" id="trackerElapsed">0s</span>
    </div>
    <div class="step-list" id="stepList"></div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="result" id="result">
    <div class="result-header">
      <span class="badge" id="badge"></span>
      <button class="action-btn primary" id="downloadAllBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Sab files ZIP mein download karo
      </button>
    </div>
    <div class="report" id="report"></div>
    <div id="fileList"></div>
    <details class="log-details">
      <summary>Full log dekho</summary>
      <pre id="fullLog"></pre>
    </details>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  // Prism autoloader ko batao language grammar files kahan se laayein
  if (window.Prism) {
    Prism.plugins.autoloader.languages_path = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/';
  }

  // ⚠️ YAHA APNA RENDER BACKEND URL DAALO deploy ke baad:
  const BACKEND_URL = "https://agentic-bot-backend.onrender.com";

  // Kitni der koi naya event na aaye to step ko "stuck" maan lo (UI hint hai,
  // hard-fail nahi — request abhi bhi chal rahi ho sakti hai).
  const STUCK_AFTER_MS = 25000;
  const STUCK_CHECK_INTERVAL_MS = 1000;

  const sendBtn = document.getElementById('sendBtn');
  const statusMsg = document.getElementById('statusMsg');
  const errorBox = document.getElementById('errorBox');
  const result = document.getElementById('result');
  const badge = document.getElementById('badge');
  const report = document.getElementById('report');
  const fileList = document.getElementById('fileList');
  const fullLog = document.getElementById('fullLog');
  const tracker = document.getElementById('tracker');
  const trackerHeadline = document.getElementById('trackerHeadline');
  const trackerElapsed = document.getElementById('trackerElapsed');
  const fileUploadInput = document.getElementById('fileUpload');
  const attachedFilesEl = document.getElementById('attachedFiles');
  const downloadAllBtn = document.getElementById('downloadAllBtn');

  // ---------- File upload (reference files) ----------
  // Ye files server nahi jaati as files — inka content task prompt ke
  // saath text ke roop mein bhej dete hain, taaki Planner/Coder reference
  // ke tor pe dekh sakein (jaise "is existing config jaisa banao").
  let attachedFiles = []; // { name, content }
  let lastResultData = null; // download-all ZIP button ke liye

  fileUploadInput.addEventListener('change', async () => {
    const newFiles = Array.from(fileUploadInput.files || []);
    for (const f of newFiles) {
      if (f.size > 200 * 1024) {
        alert(`${f.name} bahut badi hai (200KB se zyada) — skip kar diya.`);
        continue;
      }
      const content = await f.text();
      attachedFiles.push({ name: f.name, content });
    }
    fileUploadInput.value = ''; // reset taaki same file dobara select ho sake
    renderAttachedFiles();
  });

  function renderAttachedFiles() {
    attachedFilesEl.innerHTML = attachedFiles.map((f, i) => `
      <span class="attached-chip">
        ${escapeHtml(f.name)}
        <button type="button" data-idx="${i}" aria-label="Remove ${escapeHtml(f.name)}">×</button>
      </span>
    `).join('');
    attachedFilesEl.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        attachedFiles.splice(parseInt(btn.dataset.idx, 10), 1);
        renderAttachedFiles();
      });
    });
  }

  function buildTaskWithAttachments(task) {
    if (attachedFiles.length === 0) return task;
    const contextBlock = attachedFiles
      .map(f => `--- ${f.name} ---\n${f.content}`)
      .join('\n\n');
    return `${task}\n\nReference ke liye attach ki gayi files (inhe dekh ke context lo, zaroorat ho to inse related code likho):\n${contextBlock}`;
  }

  // ---------- File extension -> Prism language ----------
  const EXT_TO_PRISM_LANG = {
    js: 'javascript', mjs: 'javascript', jsx: 'jsx',
    ts: 'typescript', tsx: 'tsx',
    py: 'python', html: 'markup', htm: 'markup', xml: 'markup',
    css: 'css', json: 'json', md: 'markdown',
    rb: 'ruby', go: 'go', java: 'java', rs: 'rust',
    sh: 'bash', bash: 'bash', php: 'php', yml: 'yaml', yaml: 'yaml',
  };
  function langForFile(path) {
    const ext = path.split('.').pop().toLowerCase();
    return EXT_TO_PRISM_LANG[ext] || 'markup';
  }

  // ---------- Copy / download helpers ----------
  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.innerHTML;
      btn.textContent = '✓ Copied';
      setTimeout(() => { btn.innerHTML = original; }, 1500);
    }).catch(() => {
      alert('Copy nahi ho paya — browser permission check karo.');
    });
  }

  function downloadSingleFile(path, content) {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = path.split('/').pop();
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function downloadAllAsZip(files, taskLabel) {
    const zip = new JSZip();
    files.forEach(f => zip.file(f.path, f.code));
    const blob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `project-${Date.now()}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
  const stepList = document.getElementById('stepList');

  // ---------- Step model ----------
  // Ek "step" = { id, label, status: pending|running|done|failed, sub, startedAt, lastEventAt }
  // Top-level steps: planner, sandbox, per-file(coder+test+fixer collapsed into one row per file), reporter
  let steps = [];
  let stepById = {};
  let overallStartTime = null;
  let timerHandle = null;
  let lastEventTime = null;

  function fmtElapsed(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    const rem = s % 60;
    return `${m}m ${rem}s`;
  }

  function resetTracker(fileCount) {
    steps = [
      { id: 'planner', label: 'Planner', sub: 'Files ki list bana raha hai', status: 'pending' },
      { id: 'sandbox', label: 'Sandbox', sub: 'Isolated environment taiyar ho raha hai', status: 'pending' },
      // files baad me planner-done event ke baad add honge (tab tak count pata nahi)
      { id: 'reporter', label: 'Reporter', sub: 'Final summary likh raha hai', status: 'pending' },
    ];
    stepById = Object.fromEntries(steps.map(s => [s.id, s]));
    overallStartTime = Date.now();
    lastEventTime = Date.now();
    renderTracker();
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(tick, STUCK_CHECK_INTERVAL_MS);
  }

  function insertFileSteps(filePaths) {
    const fileSteps = filePaths.map((path, i) => ({
      id: `file:${path}`,
      label: path,
      sub: 'Queue mein',
      status: 'pending',
      isFile: true,
      fileIndex: i,
    }));
    // reporter se pehle insert karo
    const reporterIdx = steps.findIndex(s => s.id === 'reporter');
    steps.splice(reporterIdx, 0, ...fileSteps);
    fileSteps.forEach(s => stepById[s.id] = s);
    renderTracker();
  }

  function setStep(id, patch) {
    const s = stepById[id];
    if (!s) return;
    Object.assign(s, patch);
    if (patch.status === 'running') s.startedAt = Date.now();
    lastEventTime = Date.now();
    renderTracker();
  }

  function tick() {
    if (!overallStartTime) return;
    trackerElapsed.textContent = fmtElapsed(Date.now() - overallStartTime);

    // Agar koi step "running" hai aur der se koi event nahi aaya, use "stuck" dikhao
    const now = Date.now();
    let changed = false;
    for (const s of steps) {
      if (s.status === 'running') {
        const stuckNow = (now - lastEventTime) > STUCK_AFTER_MS;
        if (stuckNow && !s._stuckFlag) { s._stuckFlag = true; changed = true; }
        if (!stuckNow && s._stuckFlag) { s._stuckFlag = false; changed = true; }
      }
    }
    if (changed) renderTracker();
    else renderElapsedOnly();
  }

  function renderElapsedOnly() {
    // per-step elapsed timers update karo bina pura re-render kiye (perf ke liye)
    steps.forEach(s => {
      if (s.status === 'running' && s.startedAt) {
        const el = document.getElementById(`elapsed-${cssId(s.id)}`);
        if (el) el.textContent = fmtElapsed(Date.now() - s.startedAt);
      }
    });
  }

  function cssId(id) {
    return id.replace(/[^a-zA-Z0-9]/g, '_');
  }

  function iconFor(status) {
    if (status === 'done') return '✓';
    if (status === 'failed') return '✗';
    if (status === 'running') return '<span class="dot"></span>';
    return '○';
  }

  function renderTracker() {
    const runningStep = steps.find(s => s.status === 'running');
    if (runningStep) {
      trackerHeadline.textContent = runningStep._stuckFlag
        ? `⚠️ "${runningStep.label}" me time lag raha hai — atka ho sakta hai...`
        : `Chal raha hai: ${runningStep.label}`;
    } else if (steps.every(s => s.status === 'done')) {
      trackerHeadline.textContent = '✅ Poora ho gaya';
    } else if (steps.some(s => s.status === 'failed')) {
      trackerHeadline.textContent = '⚠️ Kuch step fail hua';
    } else {
      trackerHeadline.textContent = 'Shuru ho raha hai…';
    }

    stepList.innerHTML = steps.map(s => {
      const cls = ['step', s.status];
      if (s.status === 'running' && s._stuckFlag) cls.push('stuck');
      const elapsedSpan = s.status === 'running'
        ? `<span class="step-elapsed" id="elapsed-${cssId(s.id)}">${s.startedAt ? fmtElapsed(Date.now() - s.startedAt) : ''}</span>`
        : '';
      const subText = (s.status === 'running' && s._stuckFlag)
        ? 'Response aane mein normal se zyada time lag raha hai — ho sakta hai chal raha ho, ho sakta hai atka ho.'
        : (s.sub || '');
      return `
        <div class="${cls.join(' ')}">
          <div class="icon">${iconFor(s.status)}</div>
          <div class="body">
            <div class="label"><span class="name">${escapeHtml(s.label)}</span>${elapsedSpan}</div>
            <div class="sub">${escapeHtml(subText)}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  // ---------- SSE event -> step state mapping ----------
  function handleProgressEvent(ev) {
    switch (ev.type) {
      case 'planner-start':
        setStep('planner', { status: 'running' });
        break;
      case 'planner-done':
        if (ev.ok === false) {
          setStep('planner', { status: 'failed', sub: ev.error || 'Plan parse nahi hua' });
        } else {
          setStep('planner', { status: 'done', sub: `${ev.files.length} file(s) plan hui` });
          insertFileSteps(ev.files);
        }
        break;
      case 'sandbox-start':
        setStep('sandbox', { status: 'running' });
        break;
      case 'sandbox-done':
        setStep('sandbox', { status: 'done', sub: 'Ready' });
        break;
      case 'file-start':
        setStep(`file:${ev.file}`, { status: 'running', sub: `Coder likh raha hai (file ${ev.index + 1}/${ev.total})` });
        break;
      case 'coder-start':
        setStep(`file:${ev.file}`, { status: 'running', sub: 'Coder likh raha hai...' });
        break;
      case 'coder-done':
        setStep(`file:${ev.file}`, { sub: 'Code likha gaya, ab test ho raha hai...' });
        break;
      case 'test-start':
        setStep(`file:${ev.file}`, { sub: ev.attempt > 0 ? `Dobara test ho raha hai (attempt ${ev.attempt})...` : 'Test ho raha hai...' });
        break;
      case 'test-done':
        setStep(`file:${ev.file}`, { sub: ev.ok ? 'Test pass ✓' : 'Test fail — fix karne ki koshish ho rahi hai...' });
        break;
      case 'fixer-start':
        setStep(`file:${ev.file}`, { status: 'running', sub: `Fixer bug theek kar raha hai (attempt ${ev.attempt}/${ev.maxAttempts})...` });
        break;
      case 'fixer-done':
        setStep(`file:${ev.file}`, { sub: 'Fix ho gaya, dobara test ho raha hai...' });
        break;
      case 'file-done':
        setStep(`file:${ev.file}`, {
          status: ev.ok ? 'done' : 'failed',
          sub: ev.ok ? 'Ban gaya ✓' : 'Test pass nahi hua (max attempts khatam)',
        });
        break;
      case 'reporter-start':
        setStep('reporter', { status: 'running' });
        break;
      case 'reporter-done':
        setStep('reporter', { status: 'done', sub: 'Summary taiyar' });
        break;
      case 'pipeline-error':
        // jo bhi step abhi running tha usko failed maro
        const running = steps.find(s => s.status === 'running');
        if (running) setStep(running.id, { status: 'failed', sub: ev.error });
        break;
    }
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  sendBtn.addEventListener('click', async () => {
    const rawTask = document.getElementById('task').value.trim();
    if (!rawTask) return;
    const task = buildTaskWithAttachments(rawTask);

    sendBtn.disabled = true;
    sendBtn.textContent = 'Ban raha hai...';
    statusMsg.classList.add('show');
    errorBox.classList.remove('show');
    result.classList.remove('show');
    tracker.classList.add('show');
    resetTracker();

    try {
      // Step 1: job start karo — turant jobId milega, pipeline background mein chalti hai
      const startRes = await fetch(`${BACKEND_URL}/api/project/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task })
      });
      const startData = await startRes.json();
      if (!startRes.ok) throw new Error(startData.error || `Server error (${startRes.status})`);

      const jobId = startData.jobId;

      // Step 2: har 2s me job status poll karo, jab tak done/error na ho jaaye
      let seenEventCount = 0;
      let finalData = null;
      let jobError = null;

      while (true) {
        await sleep(2000);

        const statusRes = await fetch(`${BACKEND_URL}/api/project/status/${jobId}?since=${seenEventCount}`);
        if (!statusRes.ok) {
          const errData = await statusRes.json().catch(() => ({}));
          throw new Error(errData.error || `Status check fail (${statusRes.status})`);
        }
        const statusData = await statusRes.json();

        // naye events tracker me apply karo
        statusData.events.forEach(handleProgressEvent);
        seenEventCount = statusData.eventCount;

        if (statusData.status === 'done') {
          finalData = statusData.result;
          break;
        }
        if (statusData.status === 'error') {
          jobError = statusData.error;
          break;
        }
        // status "running" hai to loop jaari rakho
      }

      if (jobError) throw new Error(jobError);
      if (!finalData) throw new Error('Server se result nahi mila');

      const data = finalData;
      lastResultData = data; // download-all button ke liye
      badge.textContent = data.success ? '✅ SUCCESS' : '⚠️ KUCH FILES FAILED';
      badge.className = 'badge ' + (data.success ? 'success' : 'fail');

      // Reporter ka summary markdown hai — render karo, phir uske andar ke
      // code blocks (agar hon) Prism se highlight karo.
      report.innerHTML = marked.parse(data.report || '(no report)');
      if (window.Prism) Prism.highlightAllUnder(report);

      fileList.innerHTML = data.files.map((f, i) => `
        <div class="file-card">
          <div class="file-header" onclick="document.getElementById('code-${i}').classList.toggle('open')">
            <span class="file-name">${escapeHtml(f.path)}</span>
            <span class="file-status ${f.success ? 'ok' : 'fail'}">${f.success ? '✓ OK' : '✗ FAILED'}</span>
          </div>
          <div class="file-code" id="code-${i}">
            <div class="file-toolbar">
              <button type="button" class="icon-btn copy-btn" data-idx="${i}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Copy
              </button>
              <button type="button" class="icon-btn dl-btn" data-idx="${i}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download
              </button>
            </div>
            <pre class="language-${langForFile(f.path)}"><code class="language-${langForFile(f.path)}">${escapeHtml(f.code)}</code></pre>
          </div>
        </div>
      `).join('');

      // Prism ko naye code blocks highlight karne ko bolo
      if (window.Prism) Prism.highlightAllUnder(fileList);

      // Copy/download button listeners (event delegation ki jagah direct —
      // list chhoti hai, 6 files max)
      fileList.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const i = parseInt(btn.dataset.idx, 10);
          copyText(data.files[i].code, btn);
        });
      });
      fileList.querySelectorAll('.dl-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const i = parseInt(btn.dataset.idx, 10);
          downloadSingleFile(data.files[i].path, data.files[i].code);
        });
      });

      fullLog.textContent = JSON.stringify(data.log, null, 2);
      result.classList.add('show');
    } catch (err) {
      const isColdStartLikely = err.message.toLowerCase().includes('fetch');
      errorBox.textContent = isColdStartLikely
        ? 'Network error: Failed to fetch. Agar backend Render pe free tier hai aur abhi tak koi request nahi gayi thi, to server "so raha" ho sakta hai — 30-60 sec baad dobara try karo.'
        : 'Error: ' + err.message;
      errorBox.classList.add('show');
    } finally {
      if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
      sendBtn.disabled = false;
      sendBtn.textContent = 'Banao';
      statusMsg.classList.remove('show');
    }
  });

  downloadAllBtn.addEventListener('click', () => {
    if (!lastResultData || !lastResultData.files || lastResultData.files.length === 0) return;
    downloadAllAsZip(lastResultData.files);
  });
</script>
</body>
